name: 🛡️ Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

env:
  DOTNET_VERSION: "8.0.x"
  SOLUTION_PATH: "BlazzyMotion.sln"

jobs:
  analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java Runtime
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarCloud Begin
        id: sonar-begin
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -o pipefail
          dotnet sonarscanner begin \
            /k:"Blazzy-Motion_BlazzyMotion" \
            /o:"blazzy-motion" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vstest.reportsPaths="**/*.trx" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**Tests/**,**Demo/**,**/*JsInterop*.cs,**/SourceGen/**" \
            /d:sonar.exclusions="**/wwwroot/js/**" \
            /d:sonar.test.inclusions="tests/**/*" \
            /d:sonar.qualitygate.wait=true 2>&1 | tee "$RUNNER_TEMP/sonar-begin.log"

      - name: Restore Dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build Solution
        run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release /p:BlazzyUseGeneratedImports=true

      - name: Run Tests
        run: |
          dotnet test ${{ env.SOLUTION_PATH }} \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=test-results.trx" \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:CoverletOutput=../coverage/coverage.opencover.xml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Browser Regression Checks
        run: |
          npm ci --prefix tests/browser
          cd tests/browser
          npx playwright install --with-deps chromium
          cd ../..
          dotnet run --project src/BlazzyMotion.Demo -c Release --no-build --no-launch-profile --urls http://127.0.0.1:5130 > "$RUNNER_TEMP/carousel-demo.log" 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true' EXIT
          npm test --prefix tests/browser

      - name: SonarCloud End
        if: steps.sonar-begin.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Report Sonar Findings
        if: always() && steps.sonar-begin.outcome == 'success' && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.parse
          import urllib.request
          query = urllib.parse.urlencode({"componentKeys": "Blazzy-Motion_BlazzyMotion", "pullRequest": os.environ["PR_NUMBER"], "resolved": "false", "ps": 100})
          request = urllib.request.Request("https://sonarcloud.io/api/issues/search?" + query, headers={"Authorization": "Bearer " + os.environ["SONAR_TOKEN"]})
          with urllib.request.urlopen(request, timeout=30) as response:
              issues = json.load(response).get("issues", [])
          for issue in issues:
              message = issue.get("rule", "") + ": " + issue.get("message", "")
              message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::warning title=Sonar finding::" + issue.get("component", "") + ":" + str(issue.get("line", "")) + " " + message)
          PYTHON

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/coverage.opencover.xml
            tests/browser/artifacts/

      - name: Report Sonar Initialization Failure
        if: always() && steps.sonar-begin.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "sonar-begin.log"
          text = log.read_text(errors="replace") if log.exists() else "Sonar initialization failed before a log was created."
          for name in ("SONAR_TOKEN", "GITHUB_TOKEN"):
              value = os.environ.get(name)
              if value:
                  text = text.replace(value, "[REDACTED]")
          lines = [line for line in text.splitlines() if any(word in line.lower() for word in ("error", "failed", "unauthorized", "automatic analysis", "invalid", "not authorized", "not found", "permission", "exception"))]
          message = " | ".join(lines)[-2400:] or "Sonar initialization failed; inspect the SonarCloud Begin step."
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=Sonar initialization failed::" + message)
          raise SystemExit(1)
          PYTHON
