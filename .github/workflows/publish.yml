name: 📦 Publish NuGet

on:
  workflow_dispatch:
    inputs:
      core_version:
        description: "Optional: must match Directory.Build.props; leave blank to use central metadata"
        required: false
        default: ""
        type: string
      carousel_version:
        description: "Optional: must match Directory.Build.props; leave blank to use central metadata"
        required: false
        default: ""
        type: string
      bento_version:
        description: "Optional: must match Directory.Build.props; leave blank to use central metadata"
        required: false
        default: ""
        type: string
      gallery_version:
        description: "Optional: must match Directory.Build.props; leave blank to use central metadata"
        required: false
        default: ""
        type: string
      marquee_version:
        description: "Optional: must match Directory.Build.props; leave blank to use central metadata"
        required: false
        default: ""
        type: string
      publish_core:
        description: "Publish Core package?"
        required: true
        default: true
        type: boolean
      publish_carousel:
        description: "Publish Carousel package?"
        required: true
        default: true
        type: boolean
      publish_bento:
        description: "Publish Bento package?"
        required: true
        default: false
        type: boolean
      publish_gallery:
        description: "Publish Gallery package?"
        required: true
        default: false
        type: boolean
      publish_marquee:
        description: "Publish Marquee package?"
        required: true
        default: false
        type: boolean

env:
  CORE_PROJECT: "src/BlazzyMotion.Core/BlazzyMotion.Core.csproj"
  CAROUSEL_PROJECT: "src/BlazzyMotion.Carousel/BlazzyMotion.Carousel.csproj"
  BENTO_PROJECT: "src/BlazzyMotion.Bento/BlazzyMotion.Bento.csproj"
  GALLERY_PROJECT: "src/BlazzyMotion.Gallery/BlazzyMotion.Gallery.csproj"
  MARQUEE_PROJECT: "src/BlazzyMotion.Marquee/BlazzyMotion.Marquee.csproj"

jobs:
  publish:
    name: Pack & Publish
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      # Oryx interprets DOTNET_VERSION as a runtime selector; keep the SDK pin in this job.
      DOTNET_VERSION: "8.0.426"
      CORE_VERSION: ${{ inputs.core_version }}
      CAROUSEL_VERSION: ${{ inputs.carousel_version }}
      BENTO_VERSION: ${{ inputs.bento_version }}
      GALLERY_VERSION: ${{ inputs.gallery_version }}
      MARQUEE_VERSION: ${{ inputs.marquee_version }}
      PUBLISH_CORE: ${{ inputs.publish_core }}
      PUBLISH_CAROUSEL: ${{ inputs.publish_carousel }}
      PUBLISH_BENTO: ${{ inputs.publish_bento }}
      PUBLISH_GALLERY: ${{ inputs.publish_gallery }}
      PUBLISH_MARQUEE: ${{ inputs.publish_marquee }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Select Validated SDK
        run: |
          # Avoid selecting a newer SDK preinstalled on the hosted runner.
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          Path("global.json").write_text(json.dumps({"sdk": {"version": os.environ["DOTNET_VERSION"], "rollForward": "disable"}}))
          PYTHON
          test "$(dotnet --version)" = "$DOTNET_VERSION"

      - name: Resolve Central Package Versions
        run: python3 scripts/release_metadata.py resolve

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution (Release)
        run: |
          dotnet build --configuration Release --no-restore \
            /p:BlazzyCoreVersion="$CORE_VERSION" \
            /p:BlazzyCarouselVersion="$CAROUSEL_VERSION" \
            /p:BlazzyBentoVersion="$BENTO_VERSION" \
            /p:BlazzyGalleryVersion="$GALLERY_VERSION" \
            /p:BlazzyMarqueeVersion="$MARQUEE_VERSION"

      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack BlazzyMotion.Core
        if: ${{ inputs.publish_core }}
        run: |
          dotnet pack ${{ env.CORE_PROJECT }} \
            --configuration Release \
            --no-build \
            --output ./nupkgs \
            /p:BlazzyCoreVersion="$CORE_VERSION"

      - name: Pack BlazzyMotion.Carousel
        if: ${{ inputs.publish_carousel }}
        run: |
          dotnet pack ${{ env.CAROUSEL_PROJECT }} \
            --configuration Release \
            --no-build \
            --output ./nupkgs \
            /p:BlazzyCarouselVersion="$CAROUSEL_VERSION" \
            /p:BlazzyCoreVersion="$CORE_VERSION"

      - name: Pack BlazzyMotion.Bento
        if: ${{ inputs.publish_bento }}
        run: |
          dotnet pack ${{ env.BENTO_PROJECT }} \
            --configuration Release \
            --no-build \
            --output ./nupkgs \
            /p:BlazzyBentoVersion="$BENTO_VERSION" \
            /p:BlazzyCoreVersion="$CORE_VERSION"

      - name: Pack BlazzyMotion.Gallery
        if: ${{ inputs.publish_gallery }}
        run: |
          dotnet pack ${{ env.GALLERY_PROJECT }} \
            --configuration Release \
            --no-build \
            --output ./nupkgs \
            /p:BlazzyGalleryVersion="$GALLERY_VERSION" \
            /p:BlazzyCoreVersion="$CORE_VERSION"

      - name: Pack BlazzyMotion.Marquee
        if: ${{ inputs.publish_marquee }}
        run: |
          dotnet pack ${{ env.MARQUEE_PROJECT }} \
            --configuration Release \
            --no-build \
            --output ./nupkgs \
            /p:BlazzyMarqueeVersion="$MARQUEE_VERSION" \
            /p:BlazzyCoreVersion="$CORE_VERSION"

      - name: List Packages
        run: ls -lah ./nupkgs

      - name: Verify Package Versions and Dependencies
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import zipfile

          ns = {"n": "http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd"}
          for component in ("Core", "Carousel", "Bento", "Gallery", "Marquee"):
              key = component.upper()
              if os.environ[f"PUBLISH_{key}"] != "true":
                  continue
              version = os.environ[f"{key}_VERSION"]
              package = Path("nupkgs") / f"BlazzyMotion.{component}.{version}.nupkg"
              with zipfile.ZipFile(package) as archive:
                  manifests = [name for name in archive.namelist() if name.endswith(".nuspec")]
                  assert len(manifests) == 1, f"Expected one manifest in {package}"
                  metadata = ET.fromstring(archive.read(manifests[0])).find("n:metadata", ns)
                  assert metadata.findtext("n:id", namespaces=ns) == f"BlazzyMotion.{component}"
                  assert metadata.findtext("n:version", namespaces=ns) == version
                  dependencies = metadata.findall("n:dependencies/n:group/n:dependency", ns)
                  if component != "Core":
                      core = [dependency for dependency in dependencies if dependency.get("id") == "BlazzyMotion.Core"]
                      assert len(core) == 1 and core[0].get("version") == os.environ["CORE_VERSION"], f"Unexpected Core dependency in {package}"
                  if "-" not in version:
                      assert all("-" not in dependency.get("version", "") for dependency in dependencies), f"Stable package has a prerelease dependency: {package}"
              print(f"Verified {package}")
          PYTHON

      - name: Push to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          # Publish Core before packages that depend on the new version.
          core_package="./nupkgs/BlazzyMotion.Core.$CORE_VERSION.nupkg"
          if [ -f "$core_package" ]; then
            dotnet nuget push "$core_package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi
          for package in ./nupkgs/*.nupkg; do
            if [ "$package" = "$core_package" ]; then
              continue
            fi
            echo "Publishing: $package"
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Confirm NuGet Availability
        run: python3 scripts/release_metadata.py visible

      - name: Create Git Tags
        if: >-
          ${{ (inputs.publish_core && !contains(env.CORE_VERSION, '-')) ||
              (inputs.publish_carousel && !contains(env.CAROUSEL_VERSION, '-')) ||
              (inputs.publish_bento && !contains(env.BENTO_VERSION, '-')) ||
              (inputs.publish_gallery && !contains(env.GALLERY_VERSION, '-')) ||
              (inputs.publish_marquee && !contains(env.MARQUEE_VERSION, '-')) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "$PUBLISH_CORE" = "true" ] && [[ "$CORE_VERSION" != *-* ]]; then
            git tag -a "core-v$CORE_VERSION" -m "Release BlazzyMotion.Core v$CORE_VERSION" || true
            git push origin "core-v$CORE_VERSION" || echo "Tag already exists"
          fi

          if [ "$PUBLISH_CAROUSEL" = "true" ] && [[ "$CAROUSEL_VERSION" != *-* ]]; then
            git tag -a "carousel-v$CAROUSEL_VERSION" -m "Release BlazzyMotion.Carousel v$CAROUSEL_VERSION" || true
            git push origin "carousel-v$CAROUSEL_VERSION" || echo "Tag already exists"
          fi

          if [ "$PUBLISH_BENTO" = "true" ] && [[ "$BENTO_VERSION" != *-* ]]; then
            git tag -a "bento-v$BENTO_VERSION" -m "Release BlazzyMotion.Bento v$BENTO_VERSION" || true
            git push origin "bento-v$BENTO_VERSION" || echo "Tag already exists"
          fi

          if [ "$PUBLISH_GALLERY" = "true" ] && [[ "$GALLERY_VERSION" != *-* ]]; then
            git tag -a "gallery-v$GALLERY_VERSION" -m "Release BlazzyMotion.Gallery v$GALLERY_VERSION" || true
            git push origin "gallery-v$GALLERY_VERSION" || echo "Tag already exists"
          fi

          if [ "$PUBLISH_MARQUEE" = "true" ] && [[ "$MARQUEE_VERSION" != *-* ]]; then
            git tag -a "marquee-v$MARQUEE_VERSION" -m "Release BlazzyMotion.Marquee v$MARQUEE_VERSION" || true
            git push origin "marquee-v$MARQUEE_VERSION" || echo "Tag already exists"
          fi

      - name: Publication Summary
        run: |
          echo "### 🎉 NuGet Packages Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$PUBLISH_CORE" = "true" ]; then
            echo "#### BlazzyMotion.Core" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** $CORE_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **NuGet:** https://www.nuget.org/packages/BlazzyMotion.Core/$CORE_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag:** \`core-v$CORE_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PUBLISH_CAROUSEL" = "true" ]; then
            echo "#### BlazzyMotion.Carousel" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** $CAROUSEL_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Depends on:** BlazzyMotion.Core >= $CORE_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **NuGet:** https://www.nuget.org/packages/BlazzyMotion.Carousel/$CAROUSEL_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag:** \`carousel-v$CAROUSEL_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PUBLISH_BENTO" = "true" ]; then
            echo "#### BlazzyMotion.Bento" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** $BENTO_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Depends on:** BlazzyMotion.Core >= $CORE_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **NuGet:** https://www.nuget.org/packages/BlazzyMotion.Bento/$BENTO_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag:** \`bento-v$BENTO_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PUBLISH_GALLERY" = "true" ]; then
            echo "#### BlazzyMotion.Gallery" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** $GALLERY_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Depends on:** BlazzyMotion.Core >= $CORE_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **NuGet:** https://www.nuget.org/packages/BlazzyMotion.Gallery/$GALLERY_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag:** \`gallery-v$GALLERY_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$PUBLISH_MARQUEE" = "true" ]; then
            echo "#### BlazzyMotion.Marquee" >> $GITHUB_STEP_SUMMARY
            echo "- **Version:** $MARQUEE_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Depends on:** BlazzyMotion.Core >= $CORE_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **NuGet:** https://www.nuget.org/packages/BlazzyMotion.Marquee/$MARQUEE_VERSION" >> $GITHUB_STEP_SUMMARY
            echo "- **Tag:** \`marquee-v$MARQUEE_VERSION\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Installation" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          if [ "$PUBLISH_CAROUSEL" = "true" ]; then
            echo "# Install Carousel (automatically installs Core)" >> $GITHUB_STEP_SUMMARY
            echo "dotnet add package BlazzyMotion.Carousel --version $CAROUSEL_VERSION" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$PUBLISH_BENTO" = "true" ]; then
            echo "# Install Bento (automatically installs Core)" >> $GITHUB_STEP_SUMMARY
            echo "dotnet add package BlazzyMotion.Bento --version $BENTO_VERSION" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$PUBLISH_GALLERY" = "true" ]; then
            echo "# Install Gallery (automatically installs Core)" >> $GITHUB_STEP_SUMMARY
            echo "dotnet add package BlazzyMotion.Gallery --version $GALLERY_VERSION" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$PUBLISH_MARQUEE" = "true" ]; then
            echo "# Install Marquee (automatically installs Core)" >> $GITHUB_STEP_SUMMARY
            echo "dotnet add package BlazzyMotion.Marquee --version $MARQUEE_VERSION" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$PUBLISH_CORE" = "true" ] && [ "$PUBLISH_CAROUSEL" != "true" ] && [ "$PUBLISH_BENTO" != "true" ] && [ "$PUBLISH_GALLERY" != "true" ] && [ "$PUBLISH_MARQUEE" != "true" ]; then
            echo "# Install Core only" >> $GITHUB_STEP_SUMMARY
            echo "dotnet add package BlazzyMotion.Core --version $CORE_VERSION" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

  refresh_demo:
    name: Refresh Production Demo
    timeout-minutes: 20
    needs: publish
    if: ${{ needs.publish.result == 'success' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: azure-demo-production
      cancel-in-progress: false
    steps:
      - name: Checkout Current Main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check Published Metadata Against Current Main
        id: metadata
        env:
          PUBLISHED_SHA: ${{ github.sha }}
        run: |
          git merge-base --is-ancestor "$PUBLISHED_SHA" HEAD
          git show "$PUBLISHED_SHA:Directory.Build.props" > "$RUNNER_TEMP/published.props"
          python3 scripts/release_metadata.py refresh --published-props "$RUNNER_TEMP/published.props"

      - name: Build And Deploy Current Main
        if: steps.metadata.outputs.refresh == 'true'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_SEA_02B1E9803 }}
          action: upload
          production_branch: main
          app_location: src/BlazzyMotion.Demo
          api_location: ""
          output_location: wwwroot
